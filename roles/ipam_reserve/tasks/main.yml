---
- name: Resolve network for site
  ansible.builtin.set_fact:
    _ipam_network: "{{ ipam_site_networks[site | default('sydney')] }}"
    _ipam_fqdn: "{{ inventory_hostname }}.{{ ad_domain | default('hashicorp.local') }}"

# OIDC migration: the Infoblox username/password are looked up server-side by
# the "GCVE Vault Infoblox API (OIDC)" credential (jwt-aap/aap-kv-reader) and
# injected as `infoblox_username` / `infoblox_password` extra_vars — no
# in-playbook Vault auth. Attach that injector credential to the job template.

- name: Reserve next available IP in Infoblox (real)
  ansible.builtin.uri:
    url: "{{ infoblox_wapi_url }}/record:host"
    method: POST
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ _ipam_fqdn }}"
      ipv4addrs:
        - ipv4addr: "func:nextavailableip:{{ _ipam_network }}"
      view: "{{ infoblox_default_network_view }}"
      configure_for_dns: true
      comment: "Reserved by HCP Terraform / AAP for {{ inventory_hostname }}"
    status_code: 201
    validate_certs: false
  register: ipam_response
  no_log: true
  when: not ipam_simulate

- name: Reserve IP (simulated)
  ansible.builtin.debug:
    msg:
      - "SIMULATED IPAM reservation for {{ _ipam_fqdn }}"
      - "Network: {{ _ipam_network }}"
      - "Would POST to {{ infoblox_wapi_url }}/record:host with nextavailableip"
  when: ipam_simulate
