---
- name: Build snapshot name with timestamp
  ansible.builtin.set_fact:
    _snapshot_name: "{{ snapshot_name_prefix }}-{{ lookup('pipe','date +%Y%m%dT%H%M%SZ') }}"

# Single Vault lease shared across all hosts in the play. Each call to
# ldap/creds/vsphere_access creates a fresh dynamic AD account; running
# it once stops parallel hosts colliding on the templated username.
- name: Lease a vCenter service account from Vault (LDAP dynamic role)
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    path: "{{ vault_ldap_mount }}/creds/{{ vault_vsphere_ldap_role }}"
    validate_certs: false
  register: vsphere_creds_raw
  run_once: true
  delegate_to: localhost
  no_log: true   # raw module dump is noisy — clean summary follows

- name: Show what Vault just leased (demo visibility)
  ansible.builtin.debug:
    msg:
      - "Vault leased a fresh dynamic AD account from {{ vault_ldap_mount }}/creds/{{ vault_vsphere_ldap_role }}"
      - "  username       : {{ vsphere_creds_raw.data.data.username }}"
      - "  lease_id       : {{ vsphere_creds_raw.data.lease_id }}"
      - "  lease_duration : {{ vsphere_creds_raw.data.lease_duration }}s (auto-revoked + AD account deleted on expiry)"
      - "  AD groups      : {{ vsphere_creds_raw.data.data.distinguished_names | map('regex_replace', '^CN=([^,]+),.*$', '\\1') | list }}"
  run_once: true

- name: Extract vSphere username/password from the lease
  ansible.builtin.set_fact:
    _vsphere_user: "{{ (vsphere_creds_raw.data.data.username | default(vsphere_creds_raw.data.username)) ~ '@' ~ (ad_domain | default('hashicorp.local')) }}"
    _vsphere_pass: "{{ vsphere_creds_raw.data.data.password | default(vsphere_creds_raw.data.password) }}"
  run_once: true
  no_log: true   # don't dump the password

- name: Take vSphere snapshot of {{ inventory_hostname }}
  community.vmware.vmware_guest_snapshot:
    hostname: "{{ vsphere_hostname }}"
    username: "{{ _vsphere_user }}"
    password: "{{ _vsphere_pass }}"
    validate_certs: false
    datacenter: "{{ vsphere_datacenter }}"
    folder: "{{ vsphere_folder }}"
    name: "{{ inventory_hostname }}"
    state: present
    snapshot_name: "{{ _snapshot_name }}"
    description: "{{ snapshot_description }} (TTL {{ snapshot_ttl_hours }}h)"
    memory_dump: "{{ snapshot_include_memory }}"
    quiesce: "{{ snapshot_quiesce }}"
  register: snapshot_result
  no_log: true   # the resolved password parameter shouldn't end up in the log
  when: not vsphere_simulate
  delegate_to: localhost

- name: Show snapshot details (demo visibility)
  ansible.builtin.debug:
    msg:
      - "Snapshot taken on {{ inventory_hostname }}:"
      - "  name      : {{ snapshot_result.snapshot_results.current_snapshot.name }}"
      - "  id        : {{ snapshot_result.snapshot_results.current_snapshot.id }}"
      - "  created   : {{ snapshot_result.snapshot_results.current_snapshot.creation_time }}"
      - "  quiesced  : {{ snapshot_result.snapshot_results.current_snapshot.quiesced }}"
      - "  vm state  : {{ snapshot_result.snapshot_results.current_snapshot.state }}"
  when: not vsphere_simulate

- name: Take vSphere snapshot (simulated)
  ansible.builtin.debug:
    msg:
      - "SIMULATED vSphere snapshot for {{ inventory_hostname }}"
      - "vCenter={{ vsphere_hostname }}  datacenter={{ vsphere_datacenter }}"
      - "snapshot_name={{ _snapshot_name }}  quiesce={{ snapshot_quiesce }}  ttl={{ snapshot_ttl_hours }}h"
  when: vsphere_simulate
