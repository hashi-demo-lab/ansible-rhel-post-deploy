---
- name: Splunk UF install (simulated)
  ansible.builtin.debug:
    msg:
      - "SIMULATED Splunk UF install on {{ inventory_hostname }}"
      - "package: {{ splunk_uf_rpm_url }}"
      - "indexers: {{ splunk_indexers | join(',') }}"
      - "monitors: {{ splunk_monitors | map(attribute='source') | list }}"
  when: splunk_simulate

- name: Ensure splunk group exists
  ansible.builtin.group:
    name: "{{ splunk_group }}"
    state: present
    system: true
  when: not splunk_simulate

- name: Ensure splunk user exists
  ansible.builtin.user:
    name: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    system: true
    home: "{{ splunk_install_dir }}"
    shell: /sbin/nologin
    create_home: false
  when: not splunk_simulate

- name: Install Splunk Universal Forwarder package
  ansible.builtin.dnf:
    name: "{{ splunk_uf_rpm_url }}"
    state: present
    disable_gpg_check: true
  when: not splunk_simulate

# OIDC migration: the Splunk admin password is looked up server-side by the
# "GCVE Vault Splunk UF (OIDC)" credential (jwt-aap/aap-kv-reader) and injected
# as the `splunk_admin_password` extra_var — no in-playbook Vault auth. Attach
# that injector credential to the job template.

- name: Seed user-seed.conf for first start
  ansible.builtin.copy:
    dest: "{{ splunk_install_dir }}/etc/system/local/user-seed.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0600'
    content: |
      [user_info]
      USERNAME = admin
      PASSWORD = {{ splunk_admin_password }}
  no_log: true
  when: not splunk_simulate

- name: Configure outputs.conf (forward to bank indexers)
  ansible.builtin.copy:
    dest: "{{ splunk_install_dir }}/etc/system/local/outputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0640'
    content: |
      [tcpout]
      defaultGroup = bank_indexers
      [tcpout:bank_indexers]
      server = {{ splunk_indexers | join(',') }}
      useACK = true
      [tcpout-server]
  when: not splunk_simulate

- name: Configure default inputs.conf monitors
  ansible.builtin.copy:
    dest: "{{ splunk_install_dir }}/etc/system/local/inputs.conf"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_group }}"
    mode: '0640'
    content: |
      [default]
      host = {{ inventory_hostname }}
      {% for m in splunk_monitors %}
      [monitor://{{ m.source }}]
      index = {{ m.index }}
      sourcetype = {{ m.sourcetype }}

      {% endfor %}
  when: not splunk_simulate

- name: Accept license and enable boot-start
  ansible.builtin.command:
    cmd: "{{ splunk_install_dir }}/bin/splunk enable boot-start -systemd-managed 1 -user {{ splunk_user }} --accept-license --answer-yes --no-prompt"
    creates: /etc/systemd/system/SplunkForwarder.service
  when: not splunk_simulate

- name: Ensure SplunkForwarder is enabled and running
  ansible.builtin.systemd:
    name: SplunkForwarder
    enabled: true
    state: started
  when: not splunk_simulate

- name: Summary
  ansible.builtin.debug:
    msg: "Splunk UF {{ 'simulated' if splunk_simulate else ('forwarding to ' ~ splunk_indexers | length ~ ' indexer(s)') }} on {{ inventory_hostname }}"
