---
- name: CrowdStrike Falcon install (simulated)
  ansible.builtin.debug:
    msg:
      - "SIMULATED Falcon sensor install on {{ inventory_hostname }}"
      - "package: {{ falcon_sensor_rpm_url }}"
      - "tags: {{ falcon_tags }}"
      - "apd: {{ falcon_apd_enabled }}"
  when: falcon_simulate

- name: Install Falcon sensor package
  ansible.builtin.dnf:
    name: "{{ falcon_sensor_rpm_url }}"
    state: present
    disable_gpg_check: true
  when: not falcon_simulate

# OIDC migration: the Falcon CID is no longer read here via AppRole. AAP performs
# the Vault lookup server-side at job launch using the "HashiCorp Vault Secret
# Lookup (OIDC)" credential (jwt-aap/aap-kv-reader role) and injects the value as
# the `falcon_cid` extra_var. The workload-identity JWT is never exposed to this
# playbook, so an in-playbook vault_login is neither possible nor needed.
# Attach the "GCVE Vault Falcon CID (OIDC)" injector credential to the JT.
- name: Assert Falcon CID was injected by the OIDC lookup credential
  ansible.builtin.assert:
    that:
      - falcon_cid is defined
      - falcon_cid | length > 0
    fail_msg: >-
      falcon_cid was not injected. Attach the "GCVE Vault Falcon CID (OIDC)"
      credential to this job template (replaces the old "HashiCorp Vault Access"
      AppRole credential for this role).
  when: not falcon_simulate

- name: Set Falcon CID
  ansible.builtin.command:
    cmd: "/opt/CrowdStrike/falconctl -s --cid={{ falcon_cid }}"
  changed_when: true
  no_log: true
  when: not falcon_simulate

- name: Apply Falcon sensor grouping tags
  ansible.builtin.command:
    cmd: "/opt/CrowdStrike/falconctl -s --tags={{ falcon_tags | join(',') }}"
  changed_when: true
  when: not falcon_simulate

- name: Apply Falcon ProxyDisable when required
  ansible.builtin.command:
    cmd: "/opt/CrowdStrike/falconctl -s --apd={{ 'TRUE' if falcon_apd_enabled else 'FALSE' }}"
  changed_when: true
  when: not falcon_simulate

- name: Ensure falcon-sensor service is enabled and started
  ansible.builtin.systemd:
    name: falcon-sensor
    enabled: true
    state: started
  when: not falcon_simulate

- name: Verify sensor registered (check Agent ID exists)
  ansible.builtin.command:
    cmd: /opt/CrowdStrike/falconctl -g --aid
  register: falcon_aid
  changed_when: false
  retries: 6
  delay: 10
  until: "'aid=' in falcon_aid.stdout"
  when: not falcon_simulate

- name: Summary
  ansible.builtin.debug:
    msg: "Falcon sensor {{ 'simulated' if falcon_simulate else 'registered' }} on {{ inventory_hostname }}"
