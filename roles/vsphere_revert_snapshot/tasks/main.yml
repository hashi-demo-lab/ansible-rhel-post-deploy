---
- name: Lease a vCenter service account from Vault (LDAP dynamic role)
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    path: "{{ vault_ldap_mount }}/creds/{{ vault_vsphere_ldap_role }}"
    validate_certs: false
  register: vsphere_creds_raw
  run_once: true
  delegate_to: localhost
  no_log: true

- name: Show what Vault just leased (demo visibility)
  ansible.builtin.debug:
    msg:
      - "Vault leased a fresh dynamic AD account from {{ vault_ldap_mount }}/creds/{{ vault_vsphere_ldap_role }}"
      - "  username       : {{ vsphere_creds_raw.data.data.username }}"
      - "  lease_id       : {{ vsphere_creds_raw.data.lease_id }}"
      - "  lease_duration : {{ vsphere_creds_raw.data.lease_duration }}s (auto-revoked + AD account deleted on expiry)"
      - "  AD groups      : {{ vsphere_creds_raw.data.data.distinguished_names | map('regex_replace', '^CN=([^,]+),.*$', '\\1') | list }}"
  run_once: true

- name: Extract vSphere username/password from the lease
  ansible.builtin.set_fact:
    _vsphere_user: "{{ (vsphere_creds_raw.data.data.username | default(vsphere_creds_raw.data.username)) ~ '@' ~ (ad_domain | default('hashicorp.local')) }}"
    _vsphere_pass: "{{ vsphere_creds_raw.data.data.password | default(vsphere_creds_raw.data.password) }}"
  run_once: true
  no_log: true

- name: List existing snapshots on {{ inventory_hostname }}
  community.vmware.vmware_guest_snapshot_info:
    hostname: "{{ vsphere_hostname }}"
    username: "{{ _vsphere_user }}"
    password: "{{ _vsphere_pass }}"
    validate_certs: false
    datacenter: "{{ vsphere_datacenter }}"
    folder: "{{ vsphere_folder }}"
    name: "{{ inventory_hostname }}"
  register: snapshot_info
  delegate_to: localhost
  no_log: true
  when: snapshot_name | length == 0

- name: Pick the most recently created snapshot
  ansible.builtin.set_fact:
    _resolved_snapshot: >-
      {{ snapshot_name
         if snapshot_name | length > 0
         else (snapshot_info.guest_snapshots.snapshots
               | sort(attribute='creation_time')
               | last).name }}

- name: Show which snapshot will be the target (demo visibility)
  ansible.builtin.debug:
    msg: "Reverting {{ inventory_hostname }} to snapshot '{{ _resolved_snapshot }}'"

- name: Revert {{ inventory_hostname }} to snapshot {{ _resolved_snapshot }}
  community.vmware.vmware_guest_snapshot:
    hostname: "{{ vsphere_hostname }}"
    username: "{{ _vsphere_user }}"
    password: "{{ _vsphere_pass }}"
    validate_certs: false
    datacenter: "{{ vsphere_datacenter }}"
    folder: "{{ vsphere_folder }}"
    name: "{{ inventory_hostname }}"
    state: revert
    snapshot_name: "{{ _resolved_snapshot }}"
  register: revert_result
  delegate_to: localhost
  no_log: true

- name: Show revert result (demo visibility)
  ansible.builtin.debug:
    msg:
      - "Revert complete on {{ inventory_hostname }}"
      - "  reverted to    : {{ _resolved_snapshot }}"
      - "  module changed : {{ revert_result.changed }}"
