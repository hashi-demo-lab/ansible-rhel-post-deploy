---
- name: Sanity-check workspace id
  ansible.builtin.assert:
    that:
      - tfc_workspace_id | length > 0
    fail_msg: "tfc_workspace_id must be set (extra_var from EDA)"

- name: Read HCP Terraform API token from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    engine_mount_point: "{{ vault_kv_mount }}"
    path: "{{ vault_tfc_secret_path }}"
    validate_certs: false
  register: tfc_creds
  no_log: true

- name: Note we have the token (demo visibility — no secret printed)
  ansible.builtin.debug:
    msg:
      - "HCP Terraform token read from Vault"
      - "  path : {{ vault_kv_mount }}/{{ vault_tfc_secret_path }}"
      - "  api  : {{ tfc_api_url }}"

# ─── Ensure the pytfe SDK is available ────────────────────────────────────
# hashicorp.terraform depends on pytfe. If the EE image ships it this
# task is a no-op; otherwise we install it on first run.
- name: Ensure pytfe Python SDK is available (dependency of hashicorp.terraform)
  ansible.builtin.pip:
    name: pytfe
    state: present
  changed_when: false

# ─── Create + apply the run via the official collection ─────────────────
- name: Create + apply the HCP Terraform run via hashicorp.terraform.run
  hashicorp.terraform.run:
    tfe_token: "{{ tfc_creds.secret.token }}"
    tfe_address: "{{ tfc_api_url | regex_replace('/api/v2$', '') }}"
    workspace_id: "{{ tfc_workspace_id }}"
    run_message: "{{ tfc_run_message }}"
    auto_apply: true
    poll: true
    poll_interval: "{{ tfc_poll_interval_seconds }}"
    poll_timeout: "{{ tfc_poll_interval_seconds * tfc_poll_max_attempts }}"
    state: present
  register: tfc_run
  no_log: true

- name: Capture run id from module result
  ansible.builtin.set_fact:
    _tfc_run_id: "{{ tfc_run.id | default('') }}"
    _tfc_run_status: "{{ tfc_run.status | default('?') }}"

- name: Show the new run (demo visibility)
  ansible.builtin.debug:
    msg:
      - "HCP Terraform run via hashicorp.terraform.run"
      - "  run_id    : {{ _tfc_run_id }}"
      - "  workspace : {{ tfc_workspace_id }}"
      - "  status    : {{ _tfc_run_status }}"
      - "  message   : {{ tfc_run_message }}"
      - "  drift remediation: {{ 'COMPLETE' if _tfc_run_status in ['applied','planned_and_finished'] else 'FAILED' }}"

# ─── Audit comment on the run ────────────────────────────────────────────
# No module in hashicorp.terraform covers run comments, so we fall back
# to a direct API call. Always posted (no `when` gate) with sensible
# fallbacks so the run history always shows what triggered it.
- name: Post audit comment on the run
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs/{{ _tfc_run_id }}/comments"
    method: POST
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
      Content-Type: "application/vnd.api+json"
    body_format: json
    body:
      data:
        type: "comments"
        attributes:
          body: |
            **Drift remediation — authorised via ServiceNow CAB approval**

            - ServiceNow CR : {{ tfc_cr_number | default('(not provided)') }}
            - Approved by   : {{ tfc_approver | default('(unknown)') }}
            - Triggered by  : AAP / Event-Driven Ansible (activation `snow-cr-approval`)
            - Job template  : `tfc-trigger-apply`
            - Collection    : `hashicorp.terraform.run` 2.0.0
            - Final status  : {{ _tfc_run_status }}
    status_code: 201
  no_log: true
  when: _tfc_run_id | length > 0

- name: Show audit comment posted (demo visibility)
  ansible.builtin.debug:
    msg: "Audit comment posted to run {{ _tfc_run_id }} — approver: {{ tfc_approver | default('(unknown)') }}, SN CR: {{ tfc_cr_number | default('(none)') }}"
  when: _tfc_run_id | length > 0

- name: Fail if run did not reach a successful terminal state
  ansible.builtin.fail:
    msg: "TFC run {{ _tfc_run_id }} ended in '{{ _tfc_run_status }}' — drift NOT remediated"
  when: _tfc_run_status not in ['applied', 'planned_and_finished']
