---
# NOTE — why this role uses ansible.builtin.uri directly instead of
# hashicorp.terraform.run:
#
# The hashicorp.terraform.run module (v2.0.0, github.com/hashicorp/
# terraform-ansible-collection) accepts a `run_message` parameter, but
# pytfe's RunCreateOptions Pydantic model has the field named `message`
# with no `run_message` alias. Pydantic's default extra='ignore'
# silently drops the kwarg, so the module submits a run with no
# message and HCP TF labels it "Triggered via API". For an audit-
# focused demo where the SN CR number + approver have to land on the
# run, that's a non-starter. Upstream issue to be filed; until it's
# fixed, the direct API call below is the reliable path. The
# collection is still in requirements.yml so we can switch back the
# moment the upstream bug is resolved.

- name: Sanity-check workspace id
  ansible.builtin.assert:
    that:
      - tfc_workspace_id | length > 0
    fail_msg: "tfc_workspace_id must be set (extra_var from EDA)"

- name: Read HCP Terraform API token from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    engine_mount_point: "{{ vault_kv_mount }}"
    path: "{{ vault_tfc_secret_path }}"
    validate_certs: false
  register: tfc_creds
  no_log: true

- name: Note we have the token (demo visibility — no secret printed)
  ansible.builtin.debug:
    msg:
      - "HCP Terraform token read from Vault"
      - "  path : {{ vault_kv_mount }}/{{ vault_tfc_secret_path }}"
      - "  api  : {{ tfc_api_url }}"

# ─── ServiceNow incident lookup (for the audit comment) ─────────────────
# Find the incident that drift-create-snow-tickets opened alongside this
# CR — both records share the workspace_id in their correlation_id. Best
# effort: any failure here is logged and ignored, so a SN outage doesn't
# block the TFC apply.
- name: Read ServiceNow credentials from Vault (for incident lookup)
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    engine_mount_point: "{{ vault_kv_mount }}"
    path: "{{ vault_servicenow_secret_path }}"
    validate_certs: false
  register: sn_creds
  no_log: true
  failed_when: false

- name: Look up the related incident on ServiceNow (best-effort)
  ansible.builtin.uri:
    url: "{{ servicenow_instance_url }}/api/now/table/incident?sysparm_query=correlation_id={{ tfc_workspace_id }}&sysparm_limit=1&sysparm_fields=number,sys_id"
    method: GET
    user: "{{ sn_creds.secret.username }}"
    password: "{{ sn_creds.secret.password }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
    return_content: true
    status_code: [200]
    validate_certs: false
  register: sn_incident_lookup
  failed_when: false
  no_log: true
  when:
    - sn_creds.secret is defined
    - servicenow_instance_url | length > 0
    - tfc_workspace_id | length > 0

- name: Resolve incident number + sys_id for the audit comment
  ansible.builtin.set_fact:
    _sn_incident_number: "{{ (sn_incident_lookup.json.result | first).number | default('') }}"
    _sn_incident_sys_id: "{{ (sn_incident_lookup.json.result | first).sys_id | default('') }}"
  when:
    - sn_incident_lookup is defined
    - sn_incident_lookup.status | default(0) == 200
    - (sn_incident_lookup.json.result | default([])) | length > 0

- name: Note incident lookup outcome (demo visibility)
  ansible.builtin.debug:
    msg: >-
      ServiceNow incident lookup
      {{ 'OK: ' ~ (_sn_incident_number | default('?')) if (_sn_incident_number | default('')) | length > 0
         else 'no matching incident — audit comment will omit incident line' }}

# ─── Create the run (direct API, sends message reliably) ────────────────
- name: Create a new HCP Terraform run on workspace {{ tfc_workspace_id }}
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs"
    method: POST
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
      Content-Type: "application/vnd.api+json"
    body_format: json
    body:
      data:
        type: "runs"
        attributes:
          message: "{{ tfc_run_message }}"
        relationships:
          workspace:
            data:
              type: "workspaces"
              id: "{{ tfc_workspace_id }}"
    status_code: 201
    return_content: true
  register: run_response
  no_log: true

- name: Capture run id
  ansible.builtin.set_fact:
    _tfc_run_id: "{{ run_response.json.data.id }}"

- name: Show the new run (demo visibility)
  ansible.builtin.debug:
    msg:
      - "HCP Terraform run queued"
      - "  run_id    : {{ _tfc_run_id }}"
      - "  workspace : {{ tfc_workspace_id }}"
      - "  status    : {{ run_response.json.data.attributes.status }}"
      - "  message   : {{ tfc_run_message }}"

# ─── Audit comment on the run ───────────────────────────────────────────
# Build clickable CR and incident links when sys_ids are known. Falls
# back to plain CR-number text when EDA didn't pass cr_sys_id (older
# rulebook) and to no-incident-line when SN lookup failed or returned
# nothing.
- name: Build SN deep-link fragments for the audit comment
  ansible.builtin.set_fact:
    _cr_link: >-
      {%- if (tfc_cr_sys_id | default('')) | length > 0 -%}
      [{{ tfc_cr_number }}]({{ servicenow_instance_url }}/nav_to.do?uri=change_request.do?sys_id={{ tfc_cr_sys_id }})
      {%- elif (tfc_cr_number | default('')) | length > 0 -%}
      {{ tfc_cr_number }}
      {%- else -%}
      (not provided)
      {%- endif -%}
    _incident_link: >-
      {%- if (_sn_incident_sys_id | default('')) | length > 0 -%}
      [{{ _sn_incident_number }}]({{ servicenow_instance_url }}/nav_to.do?uri=incident.do?sys_id={{ _sn_incident_sys_id }})
      {%- else -%}
      {%- endif -%}

- name: Post audit comment on the run
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs/{{ _tfc_run_id }}/comments"
    method: POST
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
      Content-Type: "application/vnd.api+json"
    body_format: json
    body:
      data:
        type: "comments"
        attributes:
          body: |
            **Drift remediation — authorised via ServiceNow CAB approval**

            - Change       : {{ _cr_link }}
            - Incident     : {{ _incident_link | default('(no related incident found)', true) }}
            - Approved by  : {{ tfc_approver | default('(unknown)') }}
            - Triggered by : AAP / Event-Driven Ansible (activation `snow-cr-approval`)
            - Job template : `tfc-trigger-apply`
    status_code: 201
  no_log: true

- name: Show audit comment posted (demo visibility)
  ansible.builtin.debug:
    msg: "Audit comment posted to run {{ _tfc_run_id }} — approver: {{ tfc_approver | default('(unknown)') }}, SN CR: {{ tfc_cr_number | default('(none)') }}"

# ─── Wait for the run to leave the planning phase ───────────────────────
- name: Wait for plan to finish (any post-plan or terminal state)
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs/{{ _tfc_run_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
  register: run_poll
  retries: "{{ tfc_poll_max_attempts }}"
  delay: "{{ tfc_poll_interval_seconds }}"
  until: run_poll.json.data.attributes.status not in [
           'pending',
           'fetching',
           'fetching_completed',
           'queuing',
           'managed_queued',
           'plan_queued',
           'planning',
           'cost_estimating',
           'policy_checking'
         ]
  no_log: true

- name: Show plan outcome (demo visibility)
  ansible.builtin.debug:
    msg:
      - "Plan finished"
      - "  run_id : {{ _tfc_run_id }}"
      - "  status : {{ run_poll.json.data.attributes.status }}"

- name: Fail if plan errored before apply could start
  ansible.builtin.fail:
    msg: "TFC run {{ _tfc_run_id }} ended at plan with status '{{ run_poll.json.data.attributes.status }}' — drift NOT remediated"
  when: run_poll.json.data.attributes.status in ['errored', 'canceled', 'discarded', 'policy_hard_failed']

# ─── Confirm apply (skipped if auto-apply already moved it on) ─────────
- name: Confirm the apply
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs/{{ _tfc_run_id }}/actions/apply"
    method: POST
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
      Content-Type: "application/vnd.api+json"
    body_format: json
    body:
      comment: "Confirmed by AAP / EDA after ServiceNow {{ tfc_cr_number | default('CR') }} approval ({{ tfc_approver | default('unknown') }})"
    status_code: [202, 409]
  register: apply_confirm
  when:
    - tfc_auto_confirm_apply
    - run_poll.json.data.attributes.status in ['planned', 'cost_estimated', 'policy_checked']

- name: Note auto-apply state
  ansible.builtin.debug:
    msg: >-
      Apply
      {{ 'confirmed by AAP'                  if (apply_confirm.status | default(0)) == 202
         else 'already past confirm (auto-apply)' if (apply_confirm.status | default(0)) == 409
         else ('already at ' ~ run_poll.json.data.attributes.status) }}

# ─── Wait for the run to reach a terminal state ─────────────────────────
- name: Wait for apply to complete
  ansible.builtin.uri:
    url: "{{ tfc_api_url }}/runs/{{ _tfc_run_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ tfc_creds.secret.token }}"
  register: apply_poll
  retries: "{{ tfc_poll_max_attempts }}"
  delay: "{{ tfc_poll_interval_seconds }}"
  until: apply_poll.json.data.attributes.status in [
           'applied',
           'planned_and_finished',
           'errored',
           'canceled',
           'discarded',
           'policy_hard_failed',
           'policy_soft_failed'
         ]
  no_log: true

- name: Show final result (demo visibility)
  ansible.builtin.debug:
    msg:
      - "TFC run finished"
      - "  run_id : {{ _tfc_run_id }}"
      - "  status : {{ apply_poll.json.data.attributes.status }}"
      - "  drift remediation: {{ 'COMPLETE' if apply_poll.json.data.attributes.status in ['applied','planned_and_finished'] else 'FAILED' }}"

- name: Fail if apply errored
  ansible.builtin.fail:
    msg: "TFC run {{ _tfc_run_id }} ended in '{{ apply_poll.json.data.attributes.status }}' — drift NOT remediated"
  when: apply_poll.json.data.attributes.status not in ['applied', 'planned_and_finished']
