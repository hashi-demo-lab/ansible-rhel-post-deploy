---
# HCP Terraform endpoint
tfc_api_url: "https://app.terraform.io/api/v2"

# Vault path for the HCP Terraform user/team API token. KV v2 secret
# expected shape:  { token: <hcp tf token> }
vault_addr: "https://vault.hashicorp.local:8200"
vault_kv_mount: secrets
vault_tfc_secret_path: "tfc/api"

# Workspace identification — populated by the EDA action_args when the
# rulebook fires this JT (extra_vars). The CR carries the workspace ID
# in its correlation_id field; SN business rule forwards it here.
tfc_workspace_id: ""

# Run config
tfc_run_message: "Drift remediation — triggered by AAP/EDA after ServiceNow CR approval"
tfc_auto_confirm_apply: true       # confirm-apply the run after a successful plan
tfc_poll_interval_seconds: 10
tfc_poll_max_attempts: 60          # 10 minutes default

# Identity of who approved the CR in ServiceNow — used to add an audit
# comment to the HCP TF run so the run history records the human
# decision that authorised the apply. Populated from the EDA event
# payload (event.payload.approver, event.payload.cr_number).
tfc_approver: ""
tfc_cr_number: ""
