---
- name: Check current subscription status
  ansible.builtin.command:
    cmd: subscription-manager status
  register: rhsm_status
  changed_when: false
  failed_when: false

- name: Test subscription validity with refresh
  ansible.builtin.command:
    cmd: subscription-manager refresh
  register: _refresh_test
  changed_when: false
  failed_when: false
  when: rhsm_status.rc == 0

- name: Determine if registration is needed
  ansible.builtin.set_fact:
    _needs_registration: >-
      {{ rhsm_status.rc != 0 or
         (_refresh_test.rc | default(0)) != 0 }}

- name: Force clean stale registration
  ansible.builtin.command:
    cmd: subscription-manager clean
  when: _needs_registration | bool and rhsm_status.rc == 0
  changed_when: true

# OIDC migration: the RHSM username/password are looked up server-side by the
# "HashiCorp Vault Secret Lookup (OIDC)" credential via AAP workload identity
# (JWT → Vault jwt auth → KV read) and injected as `rhel_rhn_username` /
# `rhel_rhn_password` extra_vars — no AppRole, no in-playbook Vault login.

# Always-on demo visibility: surfaces the OIDC credential in every run, even
# when registration itself is skipped (host already subscribed). Shows lengths,
# not values, so a real RHN username isn't leaked into the job log.
- name: Show RHSM credential source (OIDC workload identity)
  ansible.builtin.debug:
    msg:
      - "RHSM credentials provided by the 'HashiCorp Vault Secret Lookup (OIDC)' credential"
      - "  flow : AAP workload-identity JWT → Vault jwt auth → KV read (server-side, at job launch)"
      - "  how  : injected as extra_vars at runtime — no AppRole, no in-playbook Vault login"
      - "  rhn_username : received ({{ (rhel_rhn_username | default('')) | length }} chars)"
      - "  rhn_password : received ({{ (rhel_rhn_password | default('')) | length }} chars)"

- name: Assert the OIDC credential is attached
  ansible.builtin.assert:
    that:
      - rhel_rhn_username | default('') | length > 0
      - rhel_rhn_password | default('') | length > 0
    fail_msg: >-
      RHSM credentials were not injected — attach the
      "GCVE Vault RHEL Subscription (OIDC)" credential to this job template.
    success_msg: "OIDC credential present — RHSM username/password injected as extra_vars."

- name: Register with RHSM
  community.general.redhat_subscription:
    state: present
    username: "{{ rhel_rhn_username }}"
    password: "{{ rhel_rhn_password }}"
    auto_attach: "{{ rhsm_auto_attach }}"
    force_register: "{{ rhsm_status.rc == 0 }}"
  when: _needs_registration | bool
  no_log: true

- name: Check for Simple Content Access mode
  ansible.builtin.command:
    cmd: subscription-manager status
  register: _sca_check
  changed_when: false
  failed_when: false

- name: Refresh subscription data for SCA
  ansible.builtin.command:
    cmd: subscription-manager refresh
  when: "'Simple Content Access' in _sca_check.stdout"
  changed_when: false

- name: Clean dnf metadata after refresh
  ansible.builtin.command:
    cmd: dnf clean all
  when: "'Simple Content Access' in _sca_check.stdout"
  changed_when: false

- name: Enable required repositories
  community.general.rhsm_repository:
    name: "{{ rhsm_repos_enable }}"
    state: enabled
  when:
    - rhsm_repos_enable | length > 0
    - "'Simple Content Access' not in _sca_check.stdout"

- name: Verify repository access
  ansible.builtin.command:
    cmd: dnf repolist
  register: repo_list
  changed_when: false

- name: Display available repositories
  ansible.builtin.debug:
    msg: "{{ repo_list.stdout_lines }}"
