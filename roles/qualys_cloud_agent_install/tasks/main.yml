---
- name: Qualys Cloud Agent install (simulated)
  ansible.builtin.debug:
    msg:
      - "SIMULATED Qualys Cloud Agent install on {{ inventory_hostname }}"
      - "package: {{ qualys_agent_rpm_url }}"
      - "server_uri: {{ qualys_server_uri }}"
  when: qualys_simulate

- name: Install Qualys Cloud Agent package
  ansible.builtin.dnf:
    name: "{{ qualys_agent_rpm_url }}"
    state: present
    disable_gpg_check: true
  when: not qualys_simulate

# OIDC migration: the Qualys activation/customer IDs are looked up server-side
# by the "GCVE Vault Qualys Activation (OIDC)" credential (jwt-aap/aap-kv-reader)
# and injected as `qualys_activation_id` / `qualys_customer_id` extra_vars — no
# in-playbook Vault auth. Attach that injector credential to the job template.

- name: Activate Qualys Cloud Agent
  ansible.builtin.command:
    cmd: >-
      /usr/local/qualys/cloud-agent/bin/qualys-cloud-agent.sh
      ActivationId={{ qualys_activation_id }}
      CustomerId={{ qualys_customer_id }}
      ServerUri={{ qualys_server_uri }}
    creates: /etc/qualys/cloud-agent/qagent-log.conf
  no_log: true
  when: not qualys_simulate

- name: Ensure qualys-cloud-agent is enabled and started
  ansible.builtin.systemd:
    name: qualys-cloud-agent
    enabled: true
    state: started
  when: not qualys_simulate

- name: Summary
  ansible.builtin.debug:
    msg: "Qualys Cloud Agent {{ 'simulated' if qualys_simulate else 'activated against ' ~ qualys_server_uri }} on {{ inventory_hostname }}"
