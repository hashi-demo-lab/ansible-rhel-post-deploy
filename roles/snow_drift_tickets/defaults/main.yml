---
# ServiceNow target. Override at the JT level for any other instance.
servicenow_instance_url: "https://dev389292.service-now.com"

# Vault path for ServiceNow credentials. Expected KV v2 secret shape:
#   { username: <admin or service account>, password: <password> }
vault_addr: "https://vault.hashicorp.local:8200"
vault_kv_mount: secrets
vault_servicenow_secret_path: "servicenow/dev"

# CR / incident defaults — match the dev instance's available choices.
# assignment_group + assigned_to need to be populated BEFORE the CR can
# be moved to "Request Approval" in the OOTB Normal change workflow.
# Setting these on creation removes the manual step in the demo.
#   Software             — OOTB group, david.loo is a member
#   david.loo            — also the Change Manager approver, so the CR
#                          surfaces in his queue immediately
servicenow_assignment_group: "8a4dde73c6112278017a6a4baf547aa7"   # Software
servicenow_assigned_to: "5137153cc611227c000bbd1bd8cd2007"        # David Loo
servicenow_category: "Other"
servicenow_change_type: "normal"            # goes through full CAB approval
servicenow_change_risk: "moderate"
servicenow_change_impact: "3"

# Drift context, injected by EDA when it fires the JT
tfc_workspace_id: ""
tfc_workspace_name: ""
tfc_organization_name: ""
tfc_assessment_result_url: ""
tfc_resources_drifted: 0
