---
- name: Read ServiceNow credentials from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: approle
    role_id: "{{ role_id }}"
    secret_id: "{{ secret_id }}"
    engine_mount_point: "{{ vault_kv_mount }}"
    path: "{{ vault_servicenow_secret_path }}"
    validate_certs: false
  register: snow_creds
  no_log: true

- name: Show what Vault returned (demo visibility — no secrets)
  ansible.builtin.debug:
    msg:
      - "ServiceNow credentials read from Vault"
      - "  path     : {{ vault_kv_mount }}/{{ vault_servicenow_secret_path }}"
      - "  username : {{ snow_creds.secret.username }}"
      - "  instance : {{ servicenow_instance_url }}"

# ─── Incident ────────────────────────────────────────────────────────────
- name: Open ServiceNow incident for the detected VM drift
  ansible.builtin.uri:
    url: "{{ servicenow_instance_url }}/api/now/table/incident"
    method: POST
    user: "{{ snow_creds.secret.username }}"
    password: "{{ snow_creds.secret.password }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      short_description: "VM configuration drift — {{ tfc_workspace_name }} ({{ tfc_resources_drifted }} resource(s))"
      description: |
        AUTOMATED INCIDENT — opened by Ansible Automation Platform via
        Event-Driven Ansible after HCP Terraform detected drift on a
        managed VM workload.

        Likely drift category : VM compute / size / configuration change
                                (e.g. someone resized vCPU or memory
                                directly in vCenter outside Terraform)

        HCP Terraform workspace : {{ tfc_workspace_name }}
        Workspace ID            : {{ tfc_workspace_id }}
        Organization            : {{ tfc_organization_name }}
        Resources drifted       : {{ tfc_resources_drifted }}
        Assessment result       : {{ tfc_assessment_result_url }}

        A related Change Request will be opened for CAB approval.
        Once approved, AAP will fire the remediation `terraform apply`
        against the workspace above.
      category: "{{ servicenow_category }}"
      impact: "{{ servicenow_change_impact }}"
      urgency: "{{ servicenow_change_impact }}"
      correlation_id: "{{ tfc_workspace_id }}"
      correlation_display: "HCP Terraform workspace {{ tfc_workspace_name }}"
    status_code: 201
    return_content: true
  register: incident_response
  no_log: true

# ─── Change Request ──────────────────────────────────────────────────────
- name: Open ServiceNow change request for the remediation
  ansible.builtin.uri:
    url: "{{ servicenow_instance_url }}/api/now/table/change_request"
    method: POST
    user: "{{ snow_creds.secret.username }}"
    password: "{{ snow_creds.secret.password }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      short_description: "Reconcile VM compute drift via Terraform — {{ tfc_workspace_name }}"
      description: |
        REMEDIATION CHANGE REQUEST — created by AAP / EDA in response to
        a drift event from HCP Terraform.

        Scope          : Re-apply the declared VM configuration in
                         HCP Terraform to reverse any out-of-band changes
                         (e.g. CPU / memory / tags edited directly in
                         vCenter, or via vMotion / a console operator).
        Method         : On approval, AAP fires `terraform apply` against
                         workspace {{ tfc_workspace_name }} via the
                         HCP Terraform API. Sentinel policy still gates
                         the apply.
        Reversibility  : Snapshot taken automatically on the previous
                         lifecycle change (see linked incident notes).

        HCP Terraform workspace : {{ tfc_workspace_name }}
        Workspace ID            : {{ tfc_workspace_id }}
        Organization            : {{ tfc_organization_name }}
        Resources drifted       : {{ tfc_resources_drifted }}
        Assessment result       : {{ tfc_assessment_result_url }}
        Linked incident         : {{ incident_response.json.result.number }}

        CAB approver action: open this CR in ServiceNow and click
        "Approve" — the SN business rule will then post the approval
        event back to AAP/EDA, which will trigger the remediation apply.
      type: "{{ servicenow_change_type }}"
      category: "{{ servicenow_category }}"
      risk: "{{ servicenow_change_risk }}"
      impact: "{{ servicenow_change_impact }}"
      # Pre-populate routing so the CR is approval-ready on creation —
      # OOTB Normal change model blocks the "Request Approval"
      # transition unless these are set.
      assignment_group: "{{ servicenow_assignment_group }}"
      assigned_to: "{{ servicenow_assigned_to }}"
      # Standard SN correlation fields — the SN business rule on the
      # CR's approval transition reads these and forwards them to EDA.
      correlation_id: "{{ tfc_workspace_id }}"
      correlation_display: "HCP Terraform workspace {{ tfc_workspace_name }}"
    status_code: 201
    return_content: true
  register: cr_response
  no_log: true

- name: Show ticket details (demo visibility)
  ansible.builtin.debug:
    msg:
      - "ServiceNow tickets opened for {{ tfc_workspace_name }} drift:"
      - "  Incident : {{ incident_response.json.result.number }}  ({{ servicenow_instance_url }}/nav_to.do?uri=incident.do?sys_id={{ incident_response.json.result.sys_id }})"
      - "  Change   : {{ cr_response.json.result.number }}  ({{ servicenow_instance_url }}/nav_to.do?uri=change_request.do?sys_id={{ cr_response.json.result.sys_id }})"
      - "  Approval : {{ cr_response.json.result.approval }}  (waiting for CAB)"
      - "  correlation_id: {{ tfc_workspace_id }}"
      - "  Next step : approve the CR in ServiceNow — SN business rule fires the EDA webhook back to AAP"
