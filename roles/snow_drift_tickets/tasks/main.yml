---
- name: Sanity-check that the SN password is set
  ansible.builtin.assert:
    that:
      - servicenow_password | length > 0
    fail_msg: "servicenow_password is empty — set it as a sensitive extra_var on the job template"

- name: Build a stable correlation ID for incident <-> CR linkage
  ansible.builtin.set_fact:
    _correlation_id: "tfc-drift-{{ tfc_workspace_id }}-{{ ansible_date_time.epoch | default(lookup('pipe','date +%s')) }}"

# ─── Incident ────────────────────────────────────────────────────────────
- name: Open ServiceNow incident for the drift
  ansible.builtin.uri:
    url: "{{ servicenow_instance_url }}/api/now/table/incident"
    method: POST
    user: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      short_description: "Drift detected in HCP Terraform workspace {{ tfc_workspace_name }} ({{ tfc_resources_drifted }} resource(s))"
      description: |
        Automated incident — opened by Ansible Automation Platform via
        Event-Driven Ansible in response to a drift event from HCP
        Terraform.

        Workspace      : {{ tfc_workspace_name }}  ({{ tfc_workspace_id }})
        Organization   : {{ tfc_organization_name }}
        Resources drift: {{ tfc_resources_drifted }}
        Assessment URL : {{ tfc_assessment_result_url }}

        A related Change Request will be raised for CAB approval.
        Once the CR is approved, AAP will fire the remediation
        terraform apply.
      category: "{{ servicenow_category }}"
      impact: "{{ servicenow_change_impact }}"
      urgency: "{{ servicenow_change_impact }}"
      correlation_id: "{{ _correlation_id }}"
      correlation_display: "HCP Terraform drift"
    status_code: 201
    return_content: true
  register: incident_response
  no_log: true

# ─── Change Request ──────────────────────────────────────────────────────
- name: Open ServiceNow change request for the drift remediation
  ansible.builtin.uri:
    url: "{{ servicenow_instance_url }}/api/now/table/change_request"
    method: POST
    user: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      short_description: "Remediate HCP Terraform drift in {{ tfc_workspace_name }}"
      description: |
        Remediation Change Request — created by AAP / EDA in response
        to a drift event from HCP Terraform.

        Workspace      : {{ tfc_workspace_name }}  ({{ tfc_workspace_id }})
        Organization   : {{ tfc_organization_name }}
        Resources drift: {{ tfc_resources_drifted }}
        Assessment URL : {{ tfc_assessment_result_url }}
        Linked incident: {{ incident_response.json.result.number }}

        On approval, AAP will trigger a `terraform apply` against
        the workspace above via the HCP Terraform API.

        # CORRELATION DATA — DO NOT EDIT — used by the EDA callback
        # to identify the workspace to apply.
        # tfc_workspace_id={{ tfc_workspace_id }}
      type: "{{ servicenow_change_type }}"
      category: "{{ servicenow_category }}"
      risk: "{{ servicenow_change_risk }}"
      impact: "{{ servicenow_change_impact }}"
      correlation_id: "{{ _correlation_id }}"
      correlation_display: "HCP Terraform drift remediation"
      u_tfc_workspace_id: "{{ tfc_workspace_id }}"
      u_tfc_workspace_name: "{{ tfc_workspace_name }}"
    status_code: 201
    return_content: true
  register: cr_response
  no_log: true

- name: Show ticket details (demo visibility)
  ansible.builtin.debug:
    msg:
      - "ServiceNow tickets opened for drift on {{ tfc_workspace_name }}:"
      - "  Incident : {{ incident_response.json.result.number }}  (sys_id {{ incident_response.json.result.sys_id }})"
      - "  Change   : {{ cr_response.json.result.number }}  (sys_id {{ cr_response.json.result.sys_id }})"
      - "  Approval : {{ cr_response.json.result.approval }}  (waiting for CAB)"
      - "  Correlation ID: {{ _correlation_id }}"
      - "  Next step : CAB approval in ServiceNow triggers the EDA webhook back to AAP"
