---
# vCenter connection — pinned to the GCVE-hosted instance the workspace
# already builds VMs against.
vsphere_hostname: "vcsa-98975.fe9dbbb3.asia-southeast1.gve.goog"
vsphere_datacenter: "Datacenter"
vsphere_folder: "Demo Workloads"

# vCenter creds via Vault LDAP dynamic role (shared across all hosts in
# the play to avoid colliding on AD account creation).
vault_addr: "https://vault.hashicorp.local:8200"
vault_ldap_mount: "ldap"
vault_vsphere_ldap_role: "vsphere_access"

# Graceful guest shutdown via VMware Tools, falling back to hard power-off
# if the guest doesn't respond.
vsphere_power_state: "powered-off"
vsphere_power_force: false
vsphere_state_change_timeout: 300
