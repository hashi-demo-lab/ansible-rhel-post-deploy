---
# Litmus demo for the secret-lookup -> OIDC migration (Approach A).
#
# This playbook does NO Vault auth of its own -- contrast the legacy roles that
# run `community.hashi_vault.vault_login auth_method=approle`. Instead the secret
# arrives as the extra_var `litmus_secret`, injected by the "Litmus OIDC Injector"
# credential, whose field is an input_source into the type-39 OIDC lookup cred.
# The whole Vault auth (workload JWT -> jwt-aap/aap-kv-reader) happens server-side
# at job launch; the playbook just consumes the value.
#
# Attach the "Litmus OIDC Injected Secret" credential to the JT running this.
- name: Prove OIDC KV lookup reached the playbook
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert the secret was injected
      ansible.builtin.assert:
        that:
          - litmus_secret is defined
          - litmus_secret | length > 0
        fail_msg: >-
          litmus_secret was not injected. Check the injector credential is
          attached to this job template and its input_source resolved.
        success_msg: "OIDC KV lookup delivered a secret to the playbook."

    # no_log keeps the value out of job output -- we only prove it arrived.
    - name: Confirm receipt without leaking the value
      ansible.builtin.debug:
        msg: "litmus_secret received: {{ (litmus_secret | length) }} chars (value hidden)"
      no_log: false
