[defaults]
host_key_checking = False
stdout_callback = yaml
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[galaxy]
# Skip TLS validation when ansible-galaxy talks to the local AAP
# Automation Hub (https://aap-aap.apps.openshift-01.hashicorp.local) —
# the cluster uses a self-signed certificate. AAP attaches the
# "Local Automation Hub" galaxy credential at org level so the URL +
# token are set automatically; we just need to relax the TLS check.
ignore_certs = true
