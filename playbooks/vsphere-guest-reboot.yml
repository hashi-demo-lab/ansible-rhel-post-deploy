---
# Reboots each VM via VMware Tools (graceful, in-guest reboot).
- name: Reboot VMs via VMware Tools
  # Defaults to "all" so legacy callers keep current behaviour. TFC
  # actions wrap this with extra_vars `target_host: <hostname>` to
  # scope to a single VM.
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - vsphere_guest_reboot
