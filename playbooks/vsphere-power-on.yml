---
# Powers on each VM in inventory via vCenter.
- name: Power on VMs via vCenter
  # Defaults to "all" so legacy callers keep current behaviour. TFC
  # actions wrap this with extra_vars `target_host: <hostname>` to
  # scope to a single VM.
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - vsphere_power_on
