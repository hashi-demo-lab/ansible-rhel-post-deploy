---
# Reverts each VM to a named snapshot (or the most recently created one
# if no name supplied). Pairs with pre-vsphere-snapshot for rollback.
- name: Revert VMs to a snapshot
  # Defaults to "all" so legacy callers keep current behaviour. TFC
  # actions wrap this with extra_vars `target_host: <hostname>` to
  # scope to a single VM.
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - vsphere_revert_snapshot
